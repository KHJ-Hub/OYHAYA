<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7AAA25">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="POS 준비금">
<title>POS 준비금</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
:root{--g:#7aaa25;--gd:#5f8f1f;--bg:#f7f8f5;--line:#e4e8df;--mut:#737a6d;--good:#24623f;--warn:#875d14;--bad:#9c3030}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:#1f2619}.app{max-width:580px;margin:auto;padding:16px 12px 44px}.top{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px}h1{margin:0;font-size:23px}.small{font-size:12px;color:var(--mut)}.saved{font-size:11px;color:var(--gd);margin-top:3px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:12px;box-shadow:0 5px 18px rgba(45,60,25,.04)}.hero{background:linear-gradient(#f5fbe9,#fff)}.target,.rr{display:flex;justify-content:space-between;gap:10px}.target{align-items:flex-start}.big{font-size:25px;font-weight:800}.rule{text-align:right;line-height:1.45}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.tab,button{border:0;border-radius:12px;font-weight:800}.tab{padding:11px;background:#fff;border:1px solid #dbe5ca;color:#56604d}.tab.active,.calc,.all,.finish{background:var(--g);color:#fff}.panel{display:none}.panel.active{display:block}.row{padding:9px 0;border-bottom:1px solid #eff1ec}.step{display:grid;grid-template-columns:44px 44px 1fr 44px 44px;gap:5px;margin-top:6px}.step button{min-height:42px;background:#f8fbf4;color:var(--gd);border:1px solid #dbe5ca}.step button:active{transform:scale(.97)}.step input{min-width:0;width:100%;border:1px solid #ced8be;border-radius:11px;text-align:center;font-size:17px;font-weight:800;background:#fff}.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;margin-top:12px}.actions button,.all,.finish{min-height:44px}.reset{background:#eef1eb;color:#3e4638}.all,.finish{width:100%;margin-top:12px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:11px;background:#f8faf5;border-radius:13px;border:1px solid #edf0e8}.metric b{display:block;font-size:19px;margin-top:4px}.notice,.quick,.verify{padding:11px;border-radius:12px;margin-top:10px;font-size:13px;line-height:1.55}.ok{background:#edf8f1;color:var(--good)}.warn{background:#fff7e5;color:var(--warn)}.bad{background:#fff0f0;color:var(--bad)}.quick{border:1px dashed #c9d7b6;background:#fbfdf8}.quick ul{margin:6px 0 0;padding-left:18px}.quick li{margin:4px 0}.verify{border:1px solid #d9e9cf;background:#f6fbf2}.verify-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.check{padding:7px 8px;border-radius:9px;background:#fff;border:1px solid #e6eee0}.result{padding:8px 0;border-bottom:1px solid #eff1ec}.summarybox{display:none}.summarybox.show{display:block}.finish{display:none}.finish.show{display:block}.foot{font-size:11px;color:#8a9184;text-align:center;margin-top:16px}@media(max-width:390px){.step{grid-template-columns:40px 40px 1fr 40px 40px}.metrics,.verify-grid{grid-template-columns:1fr}.rule{max-width:150px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><img class="logo" src="./icon.svg" alt=""><div><h1>POS 준비금</h1><div class="small">POS 3대 준비금과 총 송금대상액 계산</div><div class="saved" id="saved">입력값 자동 저장 · 고속 계산</div></div></div>
  <div class="card hero">
    <div class="target"><div><div class="small">POS 1대당 목표 준비금</div><div class="big">83,000원</div></div><div class="small rule"><b>오천원권 최소 5장</b><br><b>천원권 최소 15장</b><br>5만원권은 준비금에 남기지 않음</div></div>
    <hr>
    <div class="small">3대 총 송금대상액</div><div class="big" id="grand">-</div><div class="small" id="grandStatus">POS 3대를 입력해 주세요.</div>
    <button class="all" id="all">POS 3대 한 번에 계산</button>
  </div>
  <div class="card summarybox" id="summary"><b>오늘 마감 요약</b><div id="summaryBody"></div><button class="finish" id="finish">오늘 마감 완료</button></div>
  <div class="tabs"><button class="tab active" data-tab="1">POS 1 <span id="b1"></span></button><button class="tab" data-tab="2">POS 2 <span id="b2"></span></button><button class="tab" data-tab="3">POS 3 <span id="b3"></span></button></div>
  <div id="panels"></div>
  <div class="foot">초기화와 마감 완료 전에는 확인창이 한 번 더 떠요.</div>
</div>
<script>
const T=83000,MIN5=5,MIN1=15,D=[50000,10000,5000,1000,500,100,50,10];
const U=d=>d>=1000?'장':'개',F=n=>Number(n).toLocaleString('ko-KR')+'원',S='OYHAYA_POS_V4',state={},memo=new Map();
const P=document.getElementById('panels');
for(let p=1;p<=3;p++){
  P.insertAdjacentHTML('beforeend',`<section class="panel ${p===1?'active':''}" data-panel="${p}"><div class="card"><b>POS ${p} 현재 보유 수량</b><div class="small">없는 권종은 0 또는 빈칸으로 두면 돼요.</div><div id="rows${p}"></div><div class="actions"><button class="reset" data-r="${p}">초기화</button><button class="calc" data-c="${p}">POS ${p} 계산</button></div></div><div class="card"><b>POS ${p} 계산 결과</b><div class="metrics"><div class="metric"><span class="small">현재 현금 총액</span><b id="tot${p}">0원</b></div><div class="metric"><span class="small">송금 대상액</span><b id="send${p}">-</b></div></div><div id="quick${p}" class="quick" style="display:none"></div><div id="verify${p}" class="verify" style="display:none"></div><div id="res${p}"></div><div id="coin${p}" class="notice warn" style="display:none"></div><div id="ex${p}" class="notice warn" style="display:none"></div><div id="st${p}" class="notice warn">수량을 입력한 뒤 계산해 주세요.</div></div></section>`);
  D.forEach(d=>document.getElementById('rows'+p).insertAdjacentHTML('beforeend',`<div class="row"><div class="rr"><b>${d.toLocaleString()}원</b><span class="small" id="a${p}_${d}">0원</span></div><div class="step"><button data-p="${p}" data-d="${d}" data-s="-10">-10</button><button data-p="${p}" data-d="${d}" data-s="-1">-1</button><input id="n${p}_${d}" type="number" min="0" value="0" inputmode="numeric"><button data-p="${p}" data-d="${d}" data-s="1">+1</button><button data-p="${p}" data-d="${d}" data-s="10">+10</button></div></div>`));
}
function v(id){const n=parseInt(document.getElementById(id)?.value||0,10);return Number.isFinite(n)&&n>0?n:0}
function c(p){const o={};D.forEach(d=>o[d]=v(`n${p}_${d}`));return o}
function total(p){const a=c(p);return D.reduce((s,d)=>s+a[d]*d,0)}
function save(){const x={};for(let p=1;p<=3;p++)x[p]=c(p);localStorage.setItem(S,JSON.stringify(x));saved.textContent='입력값 자동 저장됨 ✓ · 고속 계산'}
function load(){try{const x=JSON.parse(localStorage.getItem(S)||'{}');for(let p=1;p<=3;p++)D.forEach(d=>{if(x[p]?.[d]!=null)document.getElementById(`n${p}_${d}`).value=x[p][d]})}catch(e){}}
function refresh(p){const a=c(p);let t=0;D.forEach(d=>{t+=a[d]*d;document.getElementById(`a${p}_${d}`).textContent=F(a[d]*d)});document.getElementById('tot'+p).textContent=F(t);document.getElementById('b'+p).textContent=state[p]?.ok?'✓':t?'•':''}
function keyOf(av){return [10000,5000,1000,500,100,50,10].map(d=>av[d]||0).join(',')}
function solveCore(av,target){
  const ds=[10000,5000,1000,500,100,50,10],cap=target/10;
  let dp=Array(cap+1).fill(null);dp[0]={s:0,c:{50000:0,10000:0,5000:0,1000:0,500:0,100:0,50:0,10:0}};
  const score=d=>d<=500?1000000+(500-d):d===1000?1000:d===5000?80:d===10000?20:10;
  for(const d of ds){let n=Math.max(0,av[d]||0),k=1,b=[];while(n){const q=Math.min(k,n);b.push(q);n-=q;k*=2}for(const q of b){const w=d*q/10;if(w>cap)continue;for(let z=cap;z>=w;z--){const x=dp[z-w];if(!x)continue;const ns=x.s+score(d)*q;if(!dp[z]||ns>dp[z].s){const cc={...x.c};cc[d]+=q;dp[z]={s:ns,c:cc}}}}}
  return dp[cap]?.c||null;
}
function solveReserve(av){
  const safe={...av,50000:0},key=keyOf(safe);if(memo.has(key))return memo.get(key);
  if((safe[5000]||0)<MIN5||(safe[1000]||0)<MIN1){memo.set(key,null);return null}
  const base=MIN5*5000+MIN1*1000,rest={...safe,5000:safe[5000]-MIN5,1000:safe[1000]-MIN1};
  const k=solveCore(rest,T-base);if(k){k[5000]+=MIN5;k[1000]+=MIN1}
  memo.set(key,k||null);return k||null;
}
function solveEx(a){
  memo.clear();let keep=solveReserve(a);if(keep)return{keep,e:{m50:0,m10:0,a5:0,a1:0}};
  const max50=Math.min(a[50000]||0,2),max10=Math.min(a[10000]||0,9),maxChanges=max50+max10;
  for(let changes=1;changes<=maxChanges;changes++){
    for(let m50=0;m50<=Math.min(max50,changes);m50++){
      const m10=changes-m50;if(m10<0||m10>max10)continue;
      for(let f=0;f<=2*m10;f++){
        const a5=m50*10+f,a1=m10*10-f*5,avail={...a};
        avail[50000]=0;avail[10000]-=m10;avail[5000]+=a5;avail[1000]+=a1;
        keep=solveReserve(avail);if(keep)return{keep,e:{m50,m10,a5,a1}};
      }
    }
  }
  return null;
}
function finalCoins(keep){return [{d:500,b:40},{d:100,b:50},{d:50,b:50},{d:10,b:50}].filter(x=>(keep[x.d]||0)<=10).map(x=>({...x,r:keep[x.d]||0}))}
function calc(p){
  const a=c(p),t=total(p),st=document.getElementById('st'+p),res=document.getElementById('res'+p),coin=document.getElementById('coin'+p),ex=document.getElementById('ex'+p),q=document.getElementById('quick'+p),verify=document.getElementById('verify'+p);
  res.innerHTML='';coin.style.display=ex.style.display=q.style.display=verify.style.display='none';
  if(t<T){document.getElementById('send'+p).textContent='-';st.className='notice bad';st.textContent=`현재 현금이 ${F(T-t)} 부족해요.`;state[p]={ok:false};refresh(p);return state[p]}
  const s=solveEx(a);if(!s){document.getElementById('send'+p).textContent='-';st.className='notice bad';st.innerHTML='<b>현재 권종으로 준비금 조건을 맞출 수 없어요.</b><br>83,000원 · 오천원권 5장 이상 · 천원권 15장 이상을 만족하도록 지폐 환전이 필요해요.';state[p]={ok:false};refresh(p);return state[p]}
  const keep=s.keep,e=s.e,send=t-T,tasks=[],exs=[];document.getElementById('send'+p).textContent=F(send);
  D.forEach(d=>{
    let avail=a[d];if(d===50000)avail-=e.m50;if(d===10000)avail-=e.m10;if(d===5000)avail+=e.a5;if(d===1000)avail+=e.a1;
    const out=Math.max(0,avail-(keep[d]||0));let detail=`송금 ${out}${U(d)}`;
    if(d===50000&&e.m50)detail=`송금 ${out}장 · 환전 ${e.m50}장`;
    if(d===10000&&e.m10)detail=`송금 ${out}장 · 환전 ${e.m10}장`;
    if(out>0)tasks.push(`${d.toLocaleString()}원 ${out}${U(d)} 송금`);
    res.insertAdjacentHTML('beforeend',`<div class="result rr"><span><b>${d.toLocaleString()}원</b><br><span class="small">보유 ${a[d]}${U(d)}</span></span><span style="text-align:right"><b>남김 ${keep[d]||0}${U(d)}</b><br><span class="small">${detail}</span></span></div>`);
  });
  if(e.m50){exs.push(`50,000원권 ${e.m50}장 → 5,000원권 ${e.m50*10}장`);tasks.unshift(`5만원권 ${e.m50}장 환전`)}
  if(e.m10){const f=e.a5-e.m50*10,z=[];if(f)z.push(`5,000원권 ${f}장`);if(e.a1)z.push(`1,000원권 ${e.a1}장`);exs.push(`10,000원권 ${e.m10}장 → ${z.join(' + ')}`);tasks.unshift(`만원권 ${e.m10}장 환전`)}
  if(exs.length){ex.style.display='block';ex.innerHTML='<b>지폐 환전 필요</b><br>'+exs.join('<br>')}
  const coins=finalCoins(keep);if(coins.length){coin.style.display='block';coin.innerHTML='<b>동전 환전 필요</b><br>'+coins.map(x=>`${x.d.toLocaleString()}원: ${x.r}개 남음 → ${x.b}개 1묶음 환전 → ${x.r+x.b}개 예상`).join('<br>');coins.forEach(x=>tasks.push(`${x.d.toLocaleString()}원 ${x.b}개 1묶음 환전`))}
  q.style.display='block';q.innerHTML='<b>실제로 할 것</b><ul>'+(tasks.length?tasks.map(x=>`<li>${x}</li>`).join(''):'<li>별도 환전 없이 준비금만 남기면 돼요.</li>')+'</ul>';
  verify.style.display='block';verify.innerHTML=`<b>POS ${p} 준비금 검산 ✓</b><div class="verify-grid"><div class="check">준비금 <b>${F(T)} ✓</b></div><div class="check">5,000원권 <b>${keep[5000]}장 ✓</b></div><div class="check">1,000원권 <b>${keep[1000]}장 ✓</b></div><div class="check">동전 <b>${coins.length?`환전 ${coins.length}종 필요`:'부족 없음 ✓'}</b></div></div>`;
  st.className='notice ok';st.innerHTML=`<b>정확히 83,000원!</b><br>POS ${p} 송금 대상액 ${F(send)}`;
  state[p]={ok:true,send,total:t,ex:exs.length,coins:coins.length,keep};refresh(p);return state[p];
}
function clearPos(p,ask=true){if(ask&&!confirm(`POS ${p} 입력값을 정말 초기화할까요?`))return;D.forEach(d=>document.getElementById(`n${p}_${d}`).value=0);state[p]=null;document.getElementById('send'+p).textContent='-';document.getElementById('res'+p).innerHTML='';['quick','verify','coin','ex'].forEach(x=>document.getElementById(x+p).style.display='none');const st=document.getElementById('st'+p);st.className='notice warn';st.textContent='수량을 입력한 뒤 계산해 주세요.';refresh(p);save()}
function resetGrand(){grand.textContent='-';grandStatus.textContent='POS 3대를 입력해 주세요.';summary.classList.remove('show');finish.classList.remove('show');summaryBody.innerHTML=''}
document.querySelectorAll('.step button').forEach(b=>b.onclick=()=>{const p=+b.dataset.p,i=document.getElementById(`n${p}_${b.dataset.d}`);i.value=Math.max(0,v(i.id)+ +b.dataset.s);state[p]=null;refresh(p);resetGrand();save()});
document.querySelectorAll('input').forEach(i=>i.oninput=()=>{const p=+i.id.split('_')[0].slice(1);state[p]=null;refresh(p);resetGrand();save()});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.dataset.panel===b.dataset.tab))});
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>calc(+b.dataset.c));
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{clearPos(+b.dataset.r,true);resetGrand()});
all.onclick=()=>{const r=[1,2,3].map(calc);if(r.every(x=>x.ok)){const sum=r.reduce((s,x)=>s+x.send,0);grand.textContent=F(sum);grandStatus.textContent=`3대 현금 합계 ${F(r.reduce((s,x)=>s+x.total,0))} - 총 준비금 249,000원`;summary.classList.add('show');finish.classList.add('show');summaryBody.innerHTML=`<div class="metrics" style="margin-top:8px"><div class="metric"><span class="small">총 송금대상액</span><b>${F(sum)}</b></div><div class="metric"><span class="small">총 준비금</span><b>249,000원</b></div></div>`+r.map((x,i)=>`<div class="result"><b>POS ${i+1}</b> · 송금 ${F(x.send)} · 5천원 ${x.keep[5000]}장 · 천원 ${x.keep[1000]}장${x.ex?` · 지폐환전 ${x.ex}건`:''}${x.coins?` · 동전환전 ${x.coins}종`:''}</div>`).join('')}else{grand.textContent='계산 불가';grandStatus.textContent='준비금 조건을 맞출 수 없는 POS가 있어요.';summary.classList.remove('show');finish.classList.remove('show')}};
finish.onclick=()=>{if(!confirm('POS 3대 마감을 완료하고 오늘 입력값을 모두 초기화할까요?'))return;for(let p=1;p<=3;p++)clearPos(p,false);localStorage.removeItem(S);resetGrand();saved.textContent='오늘 마감 완료 ✓ · 새 입력을 시작할 수 있어요';document.querySelector('.tab[data-tab="1"]').click();window.scrollTo({top:0,behavior:'smooth'})};
load();for(let p=1;p<=3;p++)refresh(p);if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
