<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7AAA25"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="POS 준비금"><title>POS 준비금</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><style>:root{--g:#76a91e;--gd:#557f14;--bg:#f5f6f2;--card:#fff;--line:#e8ebe3;--txt:#20251d;--mut:#7c8277;--ok:#267047;--warn:#8b641c;--bad:#a13c3c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.app{max-width:560px;margin:auto;padding:18px 12px 46px}.header{display:flex;align-items:center;gap:10px;padding:2px 4px 8px}.logo{width:42px;height:42px}h1{font-size:22px;margin:0;letter-spacing:-.5px}.muted{font-size:12px;color:var(--mut)}.saved{font-size:11px;color:var(--gd);margin-top:2px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:10px}.hero{padding:18px;background:linear-gradient(145deg,#f1f8e7,#fff)}.heroTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.target{font-size:30px;font-weight:850;letter-spacing:-1px;margin-top:2px}.rules{text-align:right;font-size:11px;color:#66705d;line-height:1.6}.rules b{color:var(--gd)}.divider{height:1px;background:#e6ebdf;margin:15px 0}.grand{font-size:24px;font-weight:850;margin:2px 0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0 0}.tab{height:45px;border:1px solid #dfe6d5;background:#fff;border-radius:14px;font-weight:800;color:#5d6557}.tab.active{background:var(--g);border-color:var(--g);color:#fff}.panel{display:none}.panel.active{display:block}.sectionTitle{font-size:16px;font-weight:850;margin-bottom:2px}.row{display:grid;grid-template-columns:74px 1fr;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f0f2ed}.row:last-child{border-bottom:0}.denom{font-size:14px;font-weight:800}.amount{display:block;font-size:10px;color:var(--mut);font-weight:500;margin-top:2px}.step{display:grid;grid-template-columns:39px 39px minmax(52px,1fr) 39px 39px;gap:4px}.step button{height:39px;border:1px solid #dfe6d5;border-radius:10px;background:#f9fbf7;color:var(--gd);font-weight:800}.step input{width:100%;min-width:0;height:39px;border:1px solid #ccd7bd;border-radius:10px;text-align:center;font-size:16px;font-weight:850;color:var(--txt);background:#fff}.actions{display:grid;grid-template-columns:.8fr 1.7fr;gap:8px;margin-top:13px}button{font-family:inherit}.reset,.calc,.all,.finish{height:46px;border:0;border-radius:13px;font-weight:850}.reset{background:#eef0eb;color:#60665c}.calc,.all,.finish{background:var(--g);color:#fff}.all,.finish{width:100%;margin-top:13px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.metric{background:#f7f9f4;border-radius:14px;padding:12px}.metric span{font-size:11px;color:var(--mut)}.metric b{display:block;font-size:18px;margin-top:3px}.quick,.notice,.verify{margin-top:10px;border-radius:14px;padding:12px;font-size:13px;line-height:1.55}.quick{background:#f4faec;border:1px solid #dcebc9}.quickTitle{font-weight:850;color:#466b13}.quick ul{margin:7px 0 0;padding-left:18px}.quick li{margin:4px 0}.ok{background:#eef8f1;color:var(--ok)}.warn{background:#fff8e9;color:var(--warn)}.bad{background:#fff1f1;color:var(--bad)}.verify{background:#f7fbf4;border:1px solid #deead6}.verifyGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:7px}.check{background:#fff;border:1px solid #e7eee2;border-radius:10px;padding:8px}.details{margin-top:10px;border-top:1px solid var(--line)}.details summary{cursor:pointer;padding:12px 2px 2px;font-size:12px;font-weight:800;color:#747b6e;list-style:none}.details summary::-webkit-details-marker{display:none}.details summary:after{content:'  ▾'}.details[open] summary:after{content:'  ▴'}.result{display:flex;justify-content:space-between;gap:10px;padding:9px 1px;border-bottom:1px solid #f0f2ed;font-size:13px}.right{text-align:right}.summary{display:none}.summary.show{display:block}.finish{display:none}.finish.show{display:block}.foot{text-align:center;font-size:10px;color:#92978e;margin-top:14px}@media(max-width:390px){.app{padding-left:9px;padding-right:9px}.row{grid-template-columns:67px 1fr}.step{grid-template-columns:36px 36px minmax(48px,1fr) 36px 36px}.step button{font-size:11px}.verifyGrid,.metrics{grid-template-columns:1fr}.rules{max-width:150px}}</style></head><body><div class="app"><header class="header"><img class="logo" src="./icon.svg"><div><h1>POS 준비금</h1><div class="muted">빠르고 정확한 마감 계산</div><div class="saved" id="saved">입력값 자동 저장</div></div></header><section class="card hero"><div class="heroTop"><div><div class="muted">POS 1대 목표</div><div class="target">83,000원</div></div><div class="rules"><b>5천원권 5장 이상</b><br><b>천원권 15장 이상</b><br>5만원권은 남기지 않음</div></div><div class="divider"></div><div class="muted">3대 총 송금대상액</div><div class="grand" id="grand">-</div><div class="muted" id="grandStatus">POS별 수량을 입력해 주세요.</div><button class="all" id="all">POS 3대 한 번에 계산</button></section><section class="card summary" id="summary"><div class="sectionTitle">오늘 마감 요약</div><div id="summaryBody"></div><button class="finish" id="finish">오늘 마감 완료</button></section><nav class="tabs"><button class="tab active" data-tab="1">POS 1 <span id="b1"></span></button><button class="tab" data-tab="2">POS 2 <span id="b2"></span></button><button class="tab" data-tab="3">POS 3 <span id="b3"></span></button></nav><main id="panels"></main><div class="foot">입력값은 이 기기에만 저장돼요.</div></div><script>const T=83000,MIN5=5,MIN1=15,D=[50000,10000,5000,1000,500,100,50,10],U=d=>d>=1000?'장':'개',F=n=>Number(n).toLocaleString('ko-KR')+'원',S='OYHAYA_POS_V4',state={},memo=new Map(),P=document.getElementById('panels');for(let p=1;p<=3;p++){P.insertAdjacentHTML('beforeend',`<section class="panel ${p===1?'active':''}" data-panel="${p}"><div class="card"><div class="sectionTitle">POS ${p} 보유 수량</div><div class="muted">권종별 현재 수량을 입력하세요.</div><div id="rows${p}"></div><div class="actions"><button class="reset" data-r="${p}">초기화</button><button class="calc" data-c="${p}">POS ${p} 계산하기</button></div></div><div class="card"><div class="sectionTitle">계산 결과</div><div class="metrics"><div class="metric"><span>현재 현금</span><b id="tot${p}">0원</b></div><div class="metric"><span>송금대상액</span><b id="send${p}">-</b></div></div><div id="quick${p}" class="quick" style="display:none"></div><div id="ex${p}" class="notice warn" style="display:none"></div><div id="coin${p}" class="notice warn" style="display:none"></div><div id="verify${p}" class="verify" style="display:none"></div><div id="st${p}" class="notice warn">수량 입력 후 계산해 주세요.</div><details id="detail${p}" class="details" style="display:none"><summary>권종별 상세보기</summary><div id="res${p}"></div></details></div></section>`);D.forEach(d=>document.getElementById('rows'+p).insertAdjacentHTML('beforeend',`<div class="row"><div class="denom">${d.toLocaleString()}원<span class="amount" id="a${p}_${d}">0원</span></div><div class="step"><button data-p="${p}" data-d="${d}" data-s="-10">−10</button><button data-p="${p}" data-d="${d}" data-s="-1">−1</button><input id="n${p}_${d}" type="number" min="0" value="0" inputmode="numeric"><button data-p="${p}" data-d="${d}" data-s="1">+1</button><button data-p="${p}" data-d="${d}" data-s="10">+10</button></div></div>`))}function v(id){const n=parseInt(document.getElementById(id)?.value||0,10);return Number.isFinite(n)&&n>0?n:0}function c(p){const o={};D.forEach(d=>o[d]=v(`n${p}_${d}`));return o}function total(p){const a=c(p);return D.reduce((s,d)=>s+a[d]*d,0)}function save(){const x={};for(let p=1;p<=3;p++)x[p]=c(p);localStorage.setItem(S,JSON.stringify(x));saved.textContent='자동 저장됨 ✓'}function load(){try{const x=JSON.parse(localStorage.getItem(S)||'{}');for(let p=1;p<=3;p++)D.forEach(d=>{if(x[p]?.[d]!=null)document.getElementById(`n${p}_${d}`).value=x[p][d]})}catch(e){}}function refresh(p){const a=c(p);let t=0;D.forEach(d=>{t+=a[d]*d;document.getElementById(`a${p}_${d}`).textContent=F(a[d]*d)});document.getElementById('tot'+p).textContent=F(t);document.getElementById('b'+p).textContent=state[p]?.ok?'✓':t?'•':''}function key(av){return[10000,5000,1000,500,100,50,10].map(d=>av[d]||0).join(',')}function core(av,target){const ds=[10000,5000,1000,500,100,50,10],cap=target/10;let dp=Array(cap+1).fill(null);dp[0]={s:0,c:Object.fromEntries(D.map(d=>[d,0]))};const score=d=>d<=500?1000000+(500-d):d===1000?1000:d===5000?80:d===10000?20:10;for(const d of ds){let n=Math.max(0,av[d]||0),k=1,b=[];while(n){const q=Math.min(k,n);b.push(q);n-=q;k*=2}for(const q of b){const w=d*q/10;if(w>cap)continue;for(let z=cap;z>=w;z--){const x=dp[z-w];if(!x)continue;const ns=x.s+score(d)*q;if(!dp[z]||ns>dp[z].s){const cc={...x.c};cc[d]+=q;dp[z]={s:ns,c:cc}}}}}return dp[cap]?.c||null}function reserve(av){const safe={...av,50000:0},k0=key(safe);if(memo.has(k0))return memo.get(k0);if((safe[5000]||0)<MIN5||(safe[1000]||0)<MIN1){memo.set(k0,null);return null}const base=MIN5*5000+MIN1*1000,rest={...safe,5000:safe[5000]-MIN5,1000:safe[1000]-MIN1},k=core(rest,T-base);if(k){k[5000]+=MIN5;k[1000]+=MIN1}memo.set(k0,k||null);return k||null}function solve(a){memo.clear();let keep=reserve(a);if(keep)return{keep,e:{m50:0,m10:0,a5:0,a1:0}};const max50=Math.min(a[50000]||0,2),max10=Math.min(a[10000]||0,9);for(let changes=1;changes<=max50+max10;changes++)for(let m50=0;m50<=Math.min(max50,changes);m50++){const m10=changes-m50;if(m10<0||m10>max10)continue;for(let f=0;f<=2*m10;f++){const a5=m50*10+f,a1=m10*10-f*5,avail={...a};avail[50000]=0;avail[10000]-=m10;avail[5000]+=a5;avail[1000]+=a1;keep=reserve(avail);if(keep)return{keep,e:{m50,m10,a5,a1}}}}return null}function calc(p){const a=c(p),t=total(p),st=document.getElementById('st'+p),res=document.getElementById('res'+p),coin=document.getElementById('coin'+p),ex=document.getElementById('ex'+p),q=document.getElementById('quick'+p),verify=document.getElementById('verify'+p),detail=document.getElementById('detail'+p);res.innerHTML='';[coin,ex,q,verify,detail].forEach(x=>x.style.display='none');if(t<T){document.getElementById('send'+p).textContent='-';st.className='notice bad';st.textContent=`현금이 ${F(T-t)} 부족해요.`;state[p]={ok:false};refresh(p);return state[p]}const s=solve(a);if(!s){document.getElementById('send'+p).textContent='-';st.className='notice bad';st.innerHTML='<b>준비금 조건을 맞출 수 없어요.</b><br>5천원권 5장·천원권 15장을 남길 수 있도록 환전이 필요해요.';state[p]={ok:false};refresh(p);return state[p]}const keep=s.keep,e=s.e,send=t-T,tasks=[],exs=[];document.getElementById('send'+p).textContent=F(send);D.forEach(d=>{let avail=a[d];if(d===50000)avail-=e.m50;if(d===10000)avail-=e.m10;if(d===5000)avail+=e.a5;if(d===1000)avail+=e.a1;const out=Math.max(0,avail-(keep[d]||0));let det=`송금 ${out}${U(d)}`;if(d===50000&&e.m50)det=`송금 ${out}장 · 환전 ${e.m50}장`;if(d===10000&&e.m10)det=`송금 ${out}장 · 환전 ${e.m10}장`;if(out>0)tasks.push(`${d.toLocaleString()}원 ${out}${U(d)} 송금`);res.insertAdjacentHTML('beforeend',`<div class="result"><span><b>${d.toLocaleString()}원</b><br><span class="muted">보유 ${a[d]}${U(d)}</span></span><span class="right"><b>남김 ${keep[d]||0}${U(d)}</b><br><span class="muted">${det}</span></span></div>`)});if(e.m50){exs.push(`50,000원 ${e.m50}장 → 5,000원 ${e.m50*10}장`);tasks.unshift(`5만원권 ${e.m50}장 환전`)}if(e.m10){const f=e.a5-e.m50*10,z=[];if(f)z.push(`5,000원 ${f}장`);if(e.a1)z.push(`1,000원 ${e.a1}장`);exs.push(`10,000원 ${e.m10}장 → ${z.join(' + ')}`);tasks.unshift(`만원권 ${e.m10}장 환전`)}if(exs.length){ex.style.display='block';ex.innerHTML='<b>환전 필요</b><br>'+exs.join('<br>')}const coins=[{d:500,b:40},{d:100,b:50},{d:50,b:50},{d:10,b:50}].filter(x=>(keep[x.d]||0)<=10).map(x=>({...x,r:keep[x.d]||0}));if(coins.length){coin.style.display='block';coin.innerHTML='<b>동전 환전 필요</b><br>'+coins.map(x=>`${x.d}원 ${x.r}개 → ${x.b}개 1묶음 환전`).join('<br>');coins.forEach(x=>tasks.push(`${x.d}원 ${x.b}개 1묶음 환전`))}q.style.display='block';q.innerHTML='<div class="quickTitle">지금 할 일</div><ul>'+(tasks.length?tasks.map(x=>`<li>${x}</li>`).join(''):'<li>별도 환전 없이 준비금만 남기면 돼요.</li>')+'</ul>';verify.style.display='block';verify.innerHTML=`<b>준비금 검산 ✓</b><div class="verifyGrid"><div class="check">83,000원 <b>✓</b></div><div class="check">5천원권 ${keep[5000]}장 <b>✓</b></div><div class="check">천원권 ${keep[1000]}장 <b>✓</b></div><div class="check">동전 ${coins.length?'환전 필요':'충분 ✓'}</div></div>`;detail.style.display='block';st.className='notice ok';st.innerHTML=`<b>POS ${p} 준비 완료 ✓</b> · 송금 ${F(send)}`;state[p]={ok:true,send,total:t,ex:exs.length,coins:coins.length};refresh(p);return state[p]}function clearPos(p){D.forEach(d=>document.getElementById(`n${p}_${d}`).value=0);state[p]=null;document.getElementById('send'+p).textContent='-';document.getElementById('res'+p).innerHTML='';['quick','coin','ex','verify','detail'].forEach(x=>document.getElementById(x+p).style.display='none');const st=document.getElementById('st'+p);st.className='notice warn';st.textContent='수량 입력 후 계산해 주세요.';refresh(p)}document.querySelectorAll('.step button').forEach(b=>b.onclick=()=>{const p=+b.dataset.p,i=document.getElementById(`n${p}_${b.dataset.d}`);i.value=Math.max(0,v(i.id)+ +b.dataset.s);state[p]=null;refresh(p);save()});document.querySelectorAll('input').forEach(i=>i.oninput=()=>{const p=+i.id.split('_')[0].slice(1);state[p]=null;refresh(p);save()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.dataset.panel===b.dataset.tab))});document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>calc(+b.dataset.c));document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const p=+b.dataset.r;if(confirm(`POS ${p} 입력값을 초기화할까요?`)){clearPos(p);save()}});document.getElementById('all').onclick=()=>{const r=[1,2,3].map(calc);if(r.every(x=>x.ok)){const sum=r.reduce((s,x)=>s+x.send,0);grand.textContent=F(sum);grandStatus.textContent=`3대 현금 ${F(r.reduce((s,x)=>s+x.total,0))} · 준비금 249,000원`;summary.classList.add('show');summaryBody.innerHTML=`<div class="metrics"><div class="metric"><span>총 송금대상액</span><b>${F(sum)}</b></div><div class="metric"><span>총 준비금</span><b>249,000원</b></div></div>`+r.map((x,i)=>`<div class="result"><b>POS ${i+1}</b><span class="right">송금 <b>${F(x.send)}</b>${x.ex?`<br><span class="muted">지폐환전 ${x.ex}건</span>`:''}${x.coins?`<br><span class="muted">동전환전 ${x.coins}건</span>`:''}</span></div>`).join('');finish.classList.add('show')}else{grand.textContent='계산 불가';grandStatus.textContent='조건을 맞출 수 없는 POS가 있어요.';summary.classList.remove('show');finish.classList.remove('show')}};finish.onclick=()=>{if(!confirm('오늘 마감을 완료하고 POS 3대 입력값을 모두 초기화할까요?'))return;for(let p=1;p<=3;p++)clearPos(p);localStorage.removeItem(S);grand.textContent='-';grandStatus.textContent='POS별 수량을 입력해 주세요.';summary.classList.remove('show');finish.classList.remove('show');saved.textContent='마감 완료 · 입력값 초기화됨 ✓';alert('오늘 마감 완료! 수고했어요 💚')};load();for(let p=1;p<=3;p++)refresh(p);if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
