<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OYHAYA</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fafafa;color:#222;font-family:system-ui,sans-serif}
    main{width:100%;max-width:360px}
    h1{margin:0 0 24px;font-size:28px}
    nav{display:grid;gap:14px}
    a{display:block;padding:20px;border:1px solid #ddd;border-radius:14px;background:#fff;color:inherit;text-decoration:none;font-weight:650}
    a:focus-visible{outline:3px solid #777;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <h1>OYHAYA</h1>
    <nav aria-label="사이트 선택">
      <a href="./beauty-device/">Beauty Device Finder</a>
      <a href="./pos/">POS 준비금</a>
      <a href="./cruise/">부산 크루즈 캘린더</a>
    </nav>
  </main>
  <script>
    // Request an update of an existing root worker; never register a new one.
    if('serviceWorker' in navigator){
      const rootScope=new URL('./',location.href).href;
      navigator.serviceWorker.getRegistrations().then(registrations=>
        Promise.all(registrations.filter(registration=>registration.scope===rootScope)
          .map(registration=>registration.update().catch(()=>{})))
      ).catch(()=>{});
    }
  </script>
</body>
</html>
