<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7AAA25"><meta name="apple-mobile-web-app-capable" content="yes"><title>POS 준비금</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><style>:root{--g:#7aaa25;--bg:#f7f8f5;--line:#e4e8df;--mut:#737a6d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:#1f2619}.app{max-width:580px;margin:auto;padding:16px 12px 44px}.top{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px}h1{margin:0;font-size:23px}.small{font-size:12px;color:var(--mut)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:12px}.hero{background:linear-gradient(#f5fbe9,#fff)}.target,.rr{display:flex;justify-content:space-between;gap:10px}.big{font-size:25px;font-weight:800}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.tab,button{border:0;border-radius:12px;font-weight:800}.tab{padding:11px;background:#fff;border:1px solid #dbe5ca}.tab.active,.calc,.all{background:var(--g);color:#fff}.panel{display:none}.panel.active{display:block}.row{padding:9px 0;border-bottom:1px solid #eff1ec}.step{display:grid;grid-template-columns:44px 44px 1fr 44px 44px;gap:5px;margin-top:6px}.step button{min-height:42px;background:#f8fbf4;color:#5f8f1f;border:1px solid #dbe5ca}.step input{min-width:0;width:100%;border:1px solid #ced8be;border-radius:11px;text-align:center;font-size:17px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;margin-top:12px}.actions button,.all{min-height:44px}.reset{background:#eef1eb}.all{width:100%;margin-top:12px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:11px;background:#f8faf5;border-radius:13px}.metric b{display:block;font-size:19px;margin-top:4px}.notice,.quick{padding:11px;border-radius:12px;margin-top:10px;font-size:13px;line-height:1.5}.ok{background:#edf8f1;color:#24623f}.warn{background:#fff7e5;color:#875d14}.bad{background:#fff0f0;color:#9c3030}.quick{border:1px dashed #c9d7b6;background:#fbfdf8}.quick ul{margin:6px 0 0;padding-left:18px}.result{padding:8px 0;border-bottom:1px solid #eff1ec}.summarybox{display:none}.summarybox.show{display:block}@media(max-width:390px){.step{grid-template-columns:40px 40px 1fr 40px 40px}.metrics{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="top"><img class="logo" src="./icon.svg"><div><h1>POS 준비금</h1><div class="small">POS 3대 준비금과 총 송금대상액 계산</div><div class="small" id="saved">입력값 자동 저장 · 고속 계산</div></div></div><div class="card hero"><div class="target"><div><div class="small">POS 1대당 목표 준비금</div><div class="big">83,000원</div></div><div class="small">천원권 최소 15장 · 5만원권은 남기지 않음</div></div><hr><div class="small">3대 총 송금대상액</div><div class="big" id="grand">-</div><div class="small" id="grandStatus">POS 3대를 입력해 주세요.</div><button class="all" id="all">POS 3대 한 번에 계산</button></div><div class="card summarybox" id="summary"><b>오늘 마감 요약</b><div id="summaryBody"></div></div><div class="tabs"><button class="tab active" data-tab="1">POS 1 <span id="b1"></span></button><button class="tab" data-tab="2">POS 2 <span id="b2"></span></button><button class="tab" data-tab="3">POS 3 <span id="b3"></span></button></div><div id="panels"></div></div><script>const T=83000,MIN1=15,D=[50000,10000,5000,1000,500,100,50,10],U=d=>d>=1000?'장':'개',F=n=>n.toLocaleString('ko-KR')+'원',S='OYHAYA_POS_V4',state={},memo=new Map();const P=document.getElementById('panels');for(let p=1;p<=3;p++){P.insertAdjacentHTML('beforeend',`<section class="panel ${p==1?'active':''}" data-panel="${p}"><div class="card"><b>POS ${p} 현재 보유 수량</b><div class="small">없는 권종은 0 또는 빈칸으로 두면 돼요.</div><div id="rows${p}"></div><div class="actions"><button class="reset" data-r="${p}">초기화</button><button class="calc" data-c="${p}">POS ${p} 계산</button></div></div><div class="card"><b>POS ${p} 계산 결과</b><div class="metrics"><div class="metric"><span class="small">현재 현금 총액</span><b id="tot${p}">0원</b></div><div class="metric"><span class="small">송금 대상액</span><b id="send${p}">-</b></div></div><div id="quick${p}" class="quick" style="display:none"></div><div id="res${p}"></div><div id="coin${p}" class="notice warn" style="display:none"></div><div id="ex${p}" class="notice warn" style="display:none"></div><div id="st${p}" class="notice warn">수량을 입력한 뒤 계산해 주세요.</div></div></section>`);D.forEach(d=>document.getElementById('rows'+p).insertAdjacentHTML('beforeend',`<div class="row"><div class="rr"><b>${d.toLocaleString()}원</b><span class="small" id="a${p}_${d}">0원</span></div><div class="step"><button data-p="${p}" data-d="${d}" data-s="-10">-10</button><button data-p="${p}" data-d="${d}" data-s="-1">-1</button><input id="n${p}_${d}" type="number" min="0" value="0" inputmode="numeric"><button data-p="${p}" data-d="${d}" data-s="1">+1</button><button data-p="${p}" data-d="${d}" data-s="10">+10</button></div></div>`))}function v(id){let n=parseInt(document.getElementById(id)?.value||0);return n>0?n:0}function c(p){let o={};D.forEach(d=>o[d]=v(`n${p}_${d}`));return o}function total(p){let a=c(p);return D.reduce((s,d)=>s+a[d]*d,0)}function save(){let x={};for(let p=1;p<=3;p++)x[p]=c(p);localStorage.setItem(S,JSON.stringify(x));saved.textContent='입력값 자동 저장됨 ✓ · 고속 계산'}function load(){try{let x=JSON.parse(localStorage.getItem(S)||'{}');for(let p=1;p<=3;p++)D.forEach(d=>{if(x[p]?.[d]!=null)document.getElementById(`n${p}_${d}`).value=x[p][d]})}catch(e){}}function refresh(p){let a=c(p),t=0;D.forEach(d=>{t+=a[d]*d;document.getElementById(`a${p}_${d}`).textContent=F(a[d]*d)});document.getElementById('tot'+p).textContent=F(t);document.getElementById('b'+p).textContent=state[p]?.ok?'✓':t?'•':''}function keyOf(av){return D.map(d=>av[d]||0).join(',')}function solveCore(av,target){const ds=[10000,5000,1000,500,100,50,10],cap=target/10;let dp=Array(cap+1).fill(null);dp[0]={s:0,c:{50000:0,10000:0,5000:0,1000:0,500:0,100:0,50:0,10:0}};const score=d=>d<=500?1000000+(500-d):d==1000?1000:d==5000?60:d==10000?20:10;for(const d of ds){let n=Math.max(0,av[d]||0),k=1,b=[];while(n){let q=Math.min(k,n);b.push(q);n-=q;k*=2}for(const q of b){let w=d*q/10;if(w>cap)continue;for(let z=cap;z>=w;z--){let x=dp[z-w];if(!x)continue;let ns=x.s+score(d)*q;if(!dp[z]||ns>dp[z].s){let cc={...x.c};cc[d]+=q;dp[z]={s:ns,c:cc}}}}}return dp[cap]?.c||null}function solveKeep15(av){const safe={...av,50000:0},key=keyOf(safe);if(memo.has(key))return memo.get(key);if((safe[1000]||0)<MIN1){memo.set(key,null);return null}let rest={...safe,1000:(safe[1000]||0)-MIN1},k=solveCore(rest,T-MIN1*1000);if(k)k[1000]+=MIN1;memo.set(key,k||null);return k||null}function solveEx(a){memo.clear();let keep=solveKeep15(a);if(keep)return{keep,e:{m50:0,m10:0,a5:0,a1:0}};const max50=Math.min(a[50000]||0,2),max10=Math.min(a[10000]||0,9),maxChanges=max50+max10;for(let changes=1;changes<=maxChanges;changes++){for(let m50=0;m50<=Math.min(max50,changes);m50++){let m10=changes-m50;if(m10<0||m10>max10)continue;for(let f=0;f<=2*m10;f++){let a5=m50*10+f,a1=m10*10-f*5,avail={...a};avail[50000]=0;avail[10000]-=m10;avail[5000]+=a5;avail[1000]+=a1;let k=solveKeep15(avail);if(k)return{keep:k,e:{m50,m10,a5,a1}}}}}return null}function calc(p){let a=c(p),t=total(p),st=document.getElementById('st'+p),res=document.getElementById('res'+p),coin=document.getElementById('coin'+p),ex=document.getElementById('ex'+p),q=document.getElementById('quick'+p);res.innerHTML='';coin.style.display=ex.style.display=q.style.display='none';if(t<T){st.className='notice bad';st.textContent=`현재 현금이 ${F(T-t)} 부족해요.`;state[p]={ok:false};refresh(p);return state[p]}let s=solveEx(a);if(!s){st.className='notice bad';st.innerHTML='<b>83,000원을 맞추려면 천원권 15장을 확보하고 5만원권은 준비금에 남기지 않아야 해요.</b><br>현재 보유 권종과 가능한 환전만으로는 정확히 83,000원을 만들 수 없어요.';state[p]={ok:false};refresh(p);return state[p]}let keep=s.keep,e=s.e,send=t-T,tasks=[],exs=[];document.getElementById('send'+p).textContent=F(send);D.forEach(d=>{let avail=a[d];if(d==50000)avail-=e.m50;if(d==10000)avail-=e.m10;if(d==5000)avail+=e.a5;if(d==1000)avail+=e.a1;let out=Math.max(0,avail-(keep[d]||0));if(out>0)tasks.push(`${d.toLocaleString()}원 ${out}${U(d)} 송금`);res.insertAdjacentHTML('beforeend',`<div class="result rr"><span><b>${d.toLocaleString()}원</b><br><span class="small">보유 ${a[d]}${U(d)}</span></span><span style="text-align:right"><b>남김 ${keep[d]||0}${U(d)}</b><br><span class="small">송금 ${out}${U(d)}</span></span></div>`)});if(e.m50){exs.push(`50,000원권 ${e.m50}장 → 5,000원권 ${e.m50*10}장`);tasks.unshift(`5만원권 ${e.m50}장 환전`)}if(e.m10){let f=e.a5-e.m50*10,z=[];if(f)z.push(`5,000원권 ${f}장`);if(e.a1)z.push(`1,000원권 ${e.a1}장`);exs.push(`10,000원권 ${e.m10}장 → ${z.join(' + ')}`);tasks.unshift(`만원권 ${e.m10}장 환전`)}if(exs.length){ex.style.display='block';ex.innerHTML='<b>지폐 환전 필요</b><br>'+exs.join('<br>')}let coins=[{d:500,b:40},{d:100,b:50},{d:50,b:50},{d:10,b:50}].filter(x=>(keep[x.d]||0)<=10).map(x=>({...x,r:keep[x.d]||0}));if(coins.length){coin.style.display='block';coin.innerHTML='<b>최종 잔여 동전 기준 환전 필요</b><br>'+coins.map(x=>`${x.d}원: ${x.r}개 남음 → ${x.b}개 1묶음 환전 → ${x.r+x.b}개 예상`).join('<br>');coins.forEach(x=>tasks.push(`${x.d}원 ${x.b}개 1묶음 환전`))}q.style.display='block';q.innerHTML='<b>실제로 할 것</b><ul>'+(tasks.length?tasks.map(x=>`<li>${x}</li>`).join(''):'<li>별도 환전 없이 준비금만 남기면 돼요.</li>')+'</ul>';st.className='notice ok';st.innerHTML=`<b>정확히 83,000원!</b><br>5만원권 0장 · 천원권 ${keep[1000]}장 유지 · POS ${p} 송금 대상액 ${F(send)}`;state[p]={ok:true,send,total:t,ex:exs.length,coins:coins.length};refresh(p);return state[p]}document.querySelectorAll('.step button').forEach(b=>b.onclick=()=>{let p=+b.dataset.p,i=document.getElementById(`n${p}_${b.dataset.d}`);i.value=Math.max(0,v(i.id)+ +b.dataset.s);state[p]=null;refresh(p);save()});document.querySelectorAll('input').forEach(i=>i.oninput=()=>{let p=+i.id.split('_')[0].slice(1);state[p]=null;refresh(p);save()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x==b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.dataset.panel==b.dataset.tab))});document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>calc(+b.dataset.c));document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{let p=+b.dataset.r;D.forEach(d=>document.getElementById(`n${p}_${d}`).value=0);state[p]=null;document.getElementById('send'+p).textContent='-';document.getElementById('res'+p).innerHTML='';['quick','coin','ex'].forEach(x=>document.getElementById(x+p).style.display='none');document.getElementById('st'+p).textContent='수량을 입력한 뒤 계산해 주세요.';refresh(p);save()});all.onclick=()=>{let r=[1,2,3].map(calc);if(r.every(x=>x.ok)){let sum=r.reduce((s,x)=>s+x.send,0);grand.textContent=F(sum);grandStatus.textContent=`3대 현금 합계 ${F(r.reduce((s,x)=>s+x.total,0))} - 총 준비금 249,000원`;summary.classList.add('show');summaryBody.innerHTML=`<div class="metrics" style="margin-top:8px"><div class="metric"><span class="small">총 송금대상액</span><b>${F(sum)}</b></div><div class="metric"><span class="small">총 준비금</span><b>249,000원</b></div></div>`+r.map((x,i)=>`<div class="result"><b>POS ${i+1}</b> · 송금 ${F(x.send)}${x.ex?` · 지폐환전 ${x.ex}건`:''}${x.coins?` · 동전환전 ${x.coins}건`:''}</div>`).join('')}else{grand.textContent='계산 불가';grandStatus.textContent='천원권 15장 유지, 5만원권 0장, 정확한 83,000원 구성이 필요한 POS가 있어요.';summary.classList.remove('show')}};load();for(let p=1;p<=3;p++)refresh(p);if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
