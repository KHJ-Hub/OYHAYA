(function(){
const KEY="oyhaya.workdiary.v1",today=new Date(),pad=n=>String(n).padStart(2,"0"),dateKey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),parse=k=>{let [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)},monthEnd=(y,m)=>new Date(y,m,0).getDate(),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),id=(a,b)=>a+"|"+b;

if(day>=15&&day<=20)add(arr,"fixtures","익월 집기안 작성",day===20?0:2,day===20?"🚨 오늘 마감":"20일까지");

if(k==="2026-11-22"){add(arr,"samyang","라이트밀 하부장 삼양 보수 접수 확인",1,"보민님 접수 완료 보고 · 보수 완료 여부 추적");add(arr,"pick","12월 올영픽 테스터 잔여분 확인",2,"일부 확보·개봉 완료, 다음 주 공지 재확인")}
return off?arr.filter(x=>["new-rota","clear-prepare","next-workbook","fixtures","waste","o-first","t-all","o-last","expiry-last","expiry-first","clear-register"].includes(x.key)).map(x=>({...x,title:x.title+" · 인계/진행 여부 확인"})):arr}

document.getElementById("month").textContent=view.getFullYear()+"년 "+(view.getMonth()+1)+"월";let first=new Date(view.getFullYear(),view.getMonth(),1).getDay(),total=monthEnd(view.getFullYear(),view.getMonth()+1),cells="";
for(let i=0;i<Math.ceil((first+total)/7)*7;i++){let n=i-first+1;if(n<1||n>total){cells+='<div class="day muted"></div>';continue}let k=dateKey(new Date(view.getFullYear(),view.getMonth(),n)),s=shiftFor(k),items=generate(k),count=items.filter(t=>state.done[k]?.[t.key]).length;cells+='<button class="day '+(s==="A"?"shift-a ":s==="B"?"shift-b ":s==="OFF"?"shift-off ":"")+(k===selected?"selected ":"")+(k===dateKey(today)?"today":"")+'" data-date="'+k+'" aria-label="'+k+' '+(s==="OFF"?"휴무":s||"근무 미등록")+'"><b>'+n+'</b><small class="shift-label">'+(s==="OFF"?"휴무":s||"—")+'</small>'+(items.length?'<div class="mini-progress"><i style="width:'+(count/items.length*100)+'%"></i></div><small class="completion">'+count+'/'+items.length+'</small>':"")+'</button>'}
