name: Update cruise calendar data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch official cruise schedule
        env:
          CRUISE_API_URL: ${{ secrets.CRUISE_API_URL }}
        run: node cruise/fetch-data.mjs

      - name: Commit updated data
        run: |
          if git diff --quiet -- cruise/data.json; then
            echo "No cruise data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cruise/data.json
          git commit -m "Update cruise schedule data"
          git push
